[package]
name = "graph"
version = "0.1.0"
edition = "2024"

# Example of customizing the library in Cargo.toml.
[lib]
crate-type = ["cdylib"]

[dependencies]
macroquad = "0.4.14"
proptest = "1.11.0"
rand = "0.10.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
